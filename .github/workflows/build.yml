name: Build

# Every push to main: run the tests and build the Android app.
# A tag such as v1.0: the same, then publish the signed .apk as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test CheckYourBudget/CheckYourBudget.Core.Tests

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - run: dotnet workload install maui-android
      # Adds the Android platform the app targets, if the runner's SDK doesn't have it yet.
      - run: >-
          dotnet build CheckYourBudget/CheckYourBudget.App -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      # The release key lives in the repository's secrets, never in the code.
      # Without it the app is signed with a throwaway key: fine to try, but it can't update an installed copy.
      - name: Get the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::A release needs the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets."
            exit 1
          fi

      - name: Build the .apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Android only installs an update when its version number is higher, so every build counts up.
          version="1.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          args=(-f net10.0-android -c Release -o out
                -p:ApplicationVersion="${GITHUB_RUN_NUMBER}" -p:ApplicationDisplayVersion="$version")
          if [ -f "$RUNNER_TEMP/release.keystore" ]; then
            args+=(-p:AndroidKeyStore=true
                   -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
                   -p:AndroidSigningKeyAlias=checkyourbudget
                   -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
                   -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD)
          fi
          dotnet publish CheckYourBudget/CheckYourBudget.App "${args[@]}"
          mkdir apk
          cp out/*-Signed.apk "apk/CheckYourBudget-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.apk --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
